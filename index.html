<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ハンギョドン∞ライフ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-screen" class="start-screen hidden">
    <div class="start-card">
      <h2>前のハンギョドンはいなくなってしまいました……</h2>
      <p>もう一度、ハンギョドンを育てますか？</p>
      <button id="start-game-btn">スタート</button>
    </div>
  </div>

  <div class="game">
    <div class="character">
      <img src="hangyo_open.png" class="character-img" id="hangyo">
      <div id="comment-bubble" class="comment-bubble"></div>
    </div>

    <div class="status">
      <p>レベル: <span id="level-value">1</span> &nbsp; 経験: <span id="exp-value">0/0</span></p>
      <p>お腹</p>
      <div class="gauge">
        <div id="hunger-bar" class="gauge-fill"></div>
      </div>
      <button id="feed-btn">ご飯をあげる</button>
      <button id="walk-btn">散歩する</button>
      <button id="bath-btn">お風呂に入れる</button>
      <button id="job-btn">お金を稼ぐ</button>
      <button id="admin-btn" class="admin-btn">管理者</button>

      <div id="status-message" class="status-message" aria-live="polite"></div>

      <div id="admin-password-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-card">
          <h3>管理者パスワード</h3>
          <label for="admin-password-input" class="admin-label">管理者パスワード</label>
          <input id="admin-password-input" type="password" autocomplete="off" />
          <div class="admin-actions">
            <button id="admin-login-btn" type="button">ログイン</button>
            <button id="admin-password-cancel-btn" type="button" class="secondary-btn">キャンセル</button>
          </div>
        </div>
      </div>

      <div id="admin-menu" class="admin-menu" style="display:none;">
        <h3>管理者メニュー</h3>
        <button id="admin-sleep-toggle-btn" type="button">睡眠モード：ON</button>
        <button id="admin-send-push-btn" type="button">通知を送る</button>
        <button id="admin-reset-btn" type="button">全リセット</button>
        <button id="admin-close-btn" type="button" class="secondary-btn">閉じる</button>
      </div>

      <div id="push-notification-panel" class="push-notification-panel">
        <button id="enable-push-btn" class="push-btn">🔔 通知をONにする</button>
        <button id="disable-push-btn" class="push-btn push-btn-secondary" style="display:none;">🔕 通知をOFFにする</button>
        <p id="push-help-text" class="push-help-text">スマートフォンに空腹時の通知を受け取れます。</p>
        <p id="ios-install-hint" class="ios-install-hint">iPhone / iPad では Safari で「ホーム画面に追加」後に通知をONにしてください。</p>
      </div>

      <!-- バイトミニゲーム -->
      <div id="job-minigame" class="job-minigame" style="display:none;">
        <div class="minigame-content">
          <p id="job-status">仕事中！ボタンを連打してお金を稼ぐ！</p>
          <p>残り時間: <span id="job-timer">10</span>秒</p>
          <p>稼いだ金額: <span id="job-money">0</span>円</p>
          <button id="job-work-btn" class="job-work-btn">稼ぐ！</button>
        </div>
      </div>

      <!-- フィードメニュー -->
      <div id="feed-menu" class="feed-menu" style="display:none;">
        <p>あげるものを選んでね</p>
        <div id="feed-options"></div>
        <button id="feed-cancel">キャンセル</button>
      </div>

      <!-- 散歩イベント用ポップアップ -->
      <div id="walk-popup" class="walk-popup" style="display:none;">
        <div class="walk-popup-content">
          <p id="walk-popup-message"></p>
          <button id="walk-popup-ok">OK</button>
        </div>
      </div>

      <!-- お風呂イベント用ポップアップ -->
      <div id="bath-popup" class="bath-popup" style="display:none;">
        <div class="bath-popup-content">
          <p id="bath-popup-message"></p>
          <button id="bath-popup-ok">OK</button>
        </div>
      </div>
      <p>機嫌: <span id="mood-value">0</span></p>
      <p>お金: <span id="money-value">1000</span>円</p>
      <p>出会った日: <span id="meeting-date"></span></p>

      <div id="shop" class="shop">
        <h3>買い物</h3>
        <button data-item="onigiri">おにぎり (100円)</button>
        <button data-item="pan">パン (100円)</button>
      </div>

      <div id="inventory" class="inventory">
        <h3>所持品</h3>
        <ul id="inventory-list"></ul>
      </div>
    </div>
  </div>

  <!-- バイト終了用の右上ボタン -->
  <button id="job-finish-btn" class="job-finish-btn" style="display:none;">バイト終了</button>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
